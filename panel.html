<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude</title>
<link rel="preconnect" href="https://claude.ai" crossorigin>
<link rel="preconnect" href="https://assets-proxy.anthropic.com" crossorigin>
<link rel="preconnect" href="https://a.claude.ai" crossorigin>
<style>
  :root {
    --bg: #faf9f7; --fg: #3d3a34; --mut: #827d72;
    --line: #e7e3da; --hover: #f0ece4; --accent: #d97757;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624; --fg: #ddd9d1; --mut: #8f8a80;
      --line: #3a3936; --hover: #32312e;
    }
  }

  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { display: flex; flex-direction: column; }

  #bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 4px;
    padding: 5px 6px; border-bottom: 1px solid var(--line);
    font: 500 12px/1 ui-sans-serif, system-ui, sans-serif; color: var(--fg);
  }

  button {
    font: inherit; color: var(--fg); background: transparent; border: 0;
    padding: 6px 9px; border-radius: 7px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    transition: background 140ms cubic-bezier(.2,.7,.3,1);
  }
  button:hover { background: var(--hover); }
  button svg { width: 13px; height: 13px; flex: 0 0 auto; }
  #new svg { color: var(--accent); }

  #spacer { flex: 1 1 auto; }

  #recent-wrap { position: relative; }
  #menu {
    position: absolute; top: calc(100% + 5px); right: 0; z-index: 5;
    min-width: 210px; max-width: 280px; max-height: 320px; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px;
    opacity: 0; transform: translateY(-4px) scale(.985); pointer-events: none;
    transition: opacity 130ms cubic-bezier(.2,.7,.3,1), transform 130ms cubic-bezier(.2,.7,.3,1);
  }
  #menu.open { opacity: 1; transform: none; pointer-events: auto; }
  #menu button {
    display: block; width: 100%; text-align: left; font-weight: 400;
    overflow: hidden; text-overflow: ellipsis; padding: 7px 9px;
  }
  #menu .empty { padding: 10px; color: var(--mut); font: 400 12px/1.5 ui-sans-serif, sans-serif; }

  iframe { flex: 1 1 auto; border: 0; width: 100%; display: block; }
</style>
</head>
<body>
<div id="bar">
  <button id="new" title="New chat">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M8 3.5v9M3.5 8h9"/>
    </svg>
    New
  </button>
  <div id="spacer"></div>
  <div id="recent-wrap">
    <button id="recent" title="Recent chats">
      Recent
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6.5L8 10.5l4-4"/>
      </svg>
    </button>
    <div id="menu"></div>
  </div>
  <button id="all" title="All chats">All</button>
</div>
<iframe id="f" allow="clipboard-read; clipboard-write; microphone; camera; fullscreen"></iframe>
<script src="panel.js"></script>
</body>
</html>
